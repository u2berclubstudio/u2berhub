<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frame Guide">
<meta name="theme-color" content="#0b0c0e">
<title>Frame Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0c0e;
    --panel: #15171b;
    --panel-2: #1f2228;
    --ink: #eef0f3;
    --muted: #8b919c;
    --accent: #ffc53d;
    --ok: #34d17a;
    --warn: #ff5a4f;
    --hud: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; padding: 8px 16px; }
  .seg { display: flex; background: var(--panel); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { font-family: var(--hud); font-weight: 600; font-size: 15px; letter-spacing: .04em;
    padding: 5px 9px; border-radius: 7px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--accent); }
  .spacer { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--panel);
    display: grid; place-items: center; }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--panel-2); }

  /* stage */
  #stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
  #frame { position: relative; overflow: hidden; background: #000; }
  #frame > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; }
  #video.mirror, #ref.mirror { transform: scaleX(-1); }
  #ref { opacity: .45; pointer-events: none; }
  #ov { pointer-events: none; }
  #frame { cursor: crosshair; }

  .readout { position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
    font-family: var(--hud); font-weight: 700; font-size: 18px; letter-spacing: .06em;
    padding: 2px 10px; border-radius: 6px; background: rgba(0,0,0,.55); pointer-events: none;
    font-variant-numeric: tabular-nums; }
  .toast { position: absolute; left: 50%; top: 48px; transform: translateX(-50%);
    font-family: var(--hud); font-weight: 600; font-size: 20px; letter-spacing: .05em; text-transform: uppercase;
    padding: 4px 14px; border-radius: 8px; background: rgba(0,0,0,.6); pointer-events: none;
    transition: opacity .25s; text-align: center; width: max-content; max-width: calc(100% - 32px); }
  .toast small { display: block; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 0; text-transform: none; color: #d6d9de; margin-top: 2px; }

  #gate { position: absolute; inset: 12px 16px auto 16px; display: flex; flex-direction: column; gap: 8px;
    align-items: center; text-align: center; background: rgba(11,12,14,.86); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border: 1px solid var(--panel-2); border-radius: 14px; padding: 14px 16px; }
  #gate p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 40ch; }
  #gate .err { color: var(--warn); }
  .primary { background: var(--accent); color: #1a1406; font-weight: 700; padding: 10px 22px; border-radius: 12px; }
  .ghost-link { color: var(--muted); font-size: 13px; text-decoration: underline; }

  /* instruction card (stays until you minimise it) */
  .info { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 520px; margin: 0 auto;
    background: rgba(11,12,14,.84); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-2); border-radius: 14px; padding: 12px 12px 12px 14px;
    display: flex; gap: 10px; align-items: flex-start; }
  .info-text { flex: 1; min-width: 0; }
  .info-name { font-family: var(--hud); font-weight: 700; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; }
  .info-tip { color: #cfd3d9; font-size: 13.5px; margin-top: 2px; }
  .info-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .learn { background: var(--accent); color: #1a1406; font-weight: 700; font-size: 13px; padding: 7px 11px; border-radius: 9px; white-space: nowrap; }
  .mini { font-size: 12.5px; color: var(--muted); padding: 4px 6px; white-space: nowrap; }
  .pill { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 7px;
    background: rgba(11,12,14,.8); border: 1px solid var(--panel-2); border-radius: 999px; padding: 6px 12px 6px 8px;
    font-family: var(--hud); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; }
  .pill .i { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #1a1406;
    display: grid; place-items: center; font: italic 700 13px/1 Georgia, serif; text-transform: none; }

  /* learn-more sheet */
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 640px; max-height: 86%; display: flex; flex-direction: column;
    background: var(--panel); border-radius: 18px 18px 0 0; border: 1px solid var(--panel-2); border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-2); }
  .sheet-head h2 { flex: 1; margin: 0; font-family: var(--hud); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
  .sheet-body { overflow-y: auto; padding: 4px 16px 18px; -webkit-overflow-scrolling: touch; }
  .sheet-body h3 { margin: 16px 0 6px; font-family: var(--hud); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .sheet-body p { margin: 0; color: #d9dce1; max-width: 62ch; }
  .sheet-body ul, .sheet-body ol { margin: 0; padding-left: 20px; color: #d9dce1; display: grid; gap: 5px; max-width: 62ch; }
  .sheet-body .avoid li::marker { color: var(--warn); }
  .done { margin: 18px 0 4px; width: 100%; background: var(--panel-2); color: var(--ink); font-weight: 700; padding: 12px; border-radius: 12px; }

  /* bottom */
  .bottom { padding: 6px 0 10px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; scroll-snap-align: center; font-family: var(--hud); font-weight: 600; font-size: 16px;
    letter-spacing: .05em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1a1406; }
  .controls { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .controls label { font-family: var(--hud); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #opacity { flex: 1; min-width: 60px; accent-color: var(--accent); }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--ground); }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .actions { display: flex; gap: 8px; padding: 0 16px; }
  .actions .icon-btn { flex: 1; width: auto; height: 42px; display: flex; gap: 6px; justify-content: center; align-items: center;
    font-family: var(--hud); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }

  @media (orientation: landscape) and (max-height: 520px) {
    #app { flex-direction: row; }
    .top { flex-direction: column; padding: 10px 8px; }
    .top .seg { flex-direction: column; }
    .bottom { width: 300px; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="seg" id="aspects" role="group" aria-label="Frame shape"></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="levelBtn" aria-pressed="false" aria-label="Horizon level" title="Horizon level">
      <svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="3.2"/></svg>
    </button>
    <button class="icon-btn" id="flipCam" aria-label="Switch camera" title="Switch camera">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9.5 13.5a2.8 2.8 0 0 0 5 1.2M14.5 12.5a2.8 2.8 0 0 0-5-1.2"/></svg>
    </button>
  </div>

  <main id="stage">
    <div id="frame">
      <canvas id="bg"></canvas>
      <video id="video" playsinline muted autoplay hidden></video>
      <canvas id="ref" hidden></canvas>
      <canvas id="ov"></canvas>
    </div>
    <div class="readout" id="levelOut" hidden>0.0°</div>
    <div class="toast" id="toast" style="opacity:0"></div>
    <div class="info" id="info">
      <div class="info-text">
        <div class="info-name" id="infoName">Rule of thirds</div>
        <div class="info-tip" id="infoTip"></div>
      </div>
      <div class="info-actions">
        <button class="learn" id="learnBtn">Learn more</button>
        <button class="mini" id="infoMin" aria-label="Minimise instructions">Minimise ▾</button>
      </div>
    </div>
    <button class="pill" id="infoPill" hidden aria-label="Show instructions"><span class="i">i</span><span id="pillName"></span></button>
    <div id="gate">
      <button class="primary" id="startBtn">Start camera</button>
      <p id="gateMsg">This is a sample scene. Start the camera, set up your composition, then record in Blackmagic using the same lens (1x).</p>
    </div>
  </main>

  <div class="bottom">
    <div class="chips" id="chips" role="group" aria-label="Composition template"></div>
    <div class="controls">
      <label for="opacity">Lines</label>
      <input type="range" id="opacity" min="15" max="100" value="70">
      <div class="swatches" id="swatches" role="group" aria-label="Line colour"></div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="flipH" aria-pressed="false" title="Mirror left-right">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7 3 12l5 5M16 7l5 5-5 5"/></svg>Flip ↔
      </button>
      <button class="icon-btn" id="flipV" aria-pressed="false" title="Mirror top-bottom">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M7 8l5-5 5 5M7 16l5 5 5-5"/></svg>Flip ↕
      </button>
      <button class="icon-btn" id="refBtn" aria-pressed="false" title="Freeze a reference frame to re-match later">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 15l4-4 4 4 3-3 5 5"/></svg><span id="refLabel">Ref</span>
      </button>
    </div>
  </div>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="mini" id="sheetMin">Minimise ▾</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<script>
(() => {
  const PHI = (1 + Math.sqrt(5)) / 2;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), frame = $('frame'), video = $('video');
  const bg = $('bg'), ref = $('ref'), ov = $('ov');

  const ASPECTS = [
    { id: '9:16', r: 9 / 16 }, { id: '4:5', r: 4 / 5 }, { id: '1:1', r: 1 },
    { id: '16:9', r: 16 / 9 }, { id: 'Full', r: 0 }
  ];
  const COLORS = ['#ffffff', '#ffd60a', '#32d7ff', '#ff453a'];

  // ---------- state ----------
  const state = { aspect: '9:16', tpl: 'thirds', opacity: 70, color: COLORS[0],
    flipH: false, flipV: false, level: false, facing: 'environment', fx: 0.5, fy: 0.42, infoMin: false };
  try { Object.assign(state, JSON.parse(localStorage.getItem('frameguide') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('frameguide', JSON.stringify(state)); } catch (e) {} };

  let stream = null, hasRef = false, tilt = null, W = 0, H = 0, dpr = 1;

  // ---------- geometry helpers ----------
  function line(c, x1, y1, x2, y2) { c.moveTo(x1, y1); c.lineTo(x2, y2); }
  function clipRay(px, py, dx, dy, w, h) {
    let t = Infinity;
    if (dx > 0) t = Math.min(t, (w - px) / dx); else if (dx < 0) t = Math.min(t, -px / dx);
    if (dy > 0) t = Math.min(t, (h - py) / dy); else if (dy < 0) t = Math.min(t, -py / dy);
    return [px + dx * t, py + dy * t];
  }
  function ray(c, px, py, dx, dy, w, h) { const [x, y] = clipRay(px, py, dx, dy, w, h); line(c, px, py, x, y); }
  function foot(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, t = ((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy);
    return [ax + t * vx, ay + t * vy];
  }
  function dot(c, x, y, r) { c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2); }

  // ---------- templates ----------
  // draw(c, w, h, L, K): c styled & flipped, L = base line px, K = kit (labels, focus point)
  function brackets(c, x, y, w, h, s) {
    c.moveTo(x, y + s); c.lineTo(x, y); c.lineTo(x + s, y);
    c.moveTo(x + w - s, y); c.lineTo(x + w, y); c.lineTo(x + w, y + s);
    c.moveTo(x + w, y + h - s); c.lineTo(x + w, y + h); c.lineTo(x + w - s, y + h);
    c.moveTo(x + s, y + h); c.lineTo(x, y + h); c.lineTo(x, y + h - s);
  }
  function faint(c, f, fn) { const a = c.globalAlpha; c.globalAlpha = a * f; fn(); c.globalAlpha = a; }
  function dashed(c, L, fn) { c.save(); c.setLineDash([L * 5, L * 4]); fn(); c.restore(); }
  function thirdsFaint(c, w, h) { faint(c, 0.35, () => { c.beginPath();
    [1, 2].forEach(i => { line(c, w * i / 3, 0, w * i / 3, h); line(c, 0, h * i / 3, w, h * i / 3); }); c.stroke(); }); }

  const TEMPLATES = [
    { id: 'thirds', name: 'Rule of thirds', tip: 'Place the subject on a line or where two lines cross.', draw(c, w, h, L) {
      c.beginPath();
      [1, 2].forEach(i => { line(c, w * i / 3, 0, w * i / 3, h); line(c, 0, h * i / 3, w, h * i / 3); });
      c.stroke();
      c.beginPath(); [1, 2].forEach(i => [1, 2].forEach(j => dot(c, w * i / 3, h * j / 3, L * 3))); c.fill();
    }},
    { id: 'center', name: 'Center', tip: 'Put the subject in the exact middle for a direct, strong feel.', draw(c, w, h, L) {
      const m = Math.min(w, h);
      c.beginPath(); line(c, w / 2, h / 2 - m * 0.2, w / 2, h / 2 + m * 0.2); line(c, w / 2 - m * 0.2, h / 2, w / 2 + m * 0.2, h / 2); c.stroke();
      c.beginPath(); c.arc(w / 2, h / 2, m * 0.1, 0, Math.PI * 2); c.stroke();
      c.beginPath(); brackets(c, w * 0.3, h * 0.3, w * 0.4, h * 0.4, m * 0.06); c.stroke();
    }},
    { id: 'symmetry', name: 'Symmetry', tip: 'Keep both halves of the frame mirrored.', draw(c, w, h, L, K) {
      c.save(); c.lineWidth = L * 1.8; c.beginPath(); line(c, w / 2, 0, w / 2, h); c.stroke(); c.restore();
      dashed(c, L, () => { c.beginPath(); line(c, 0, h / 2, w, h / 2); c.stroke(); });
      c.beginPath();
      [0.15, 0.3, 0.42].forEach(f => { const t = Math.min(w, h) * 0.035;
        line(c, w / 2 - w * f, h / 2 - t, w / 2 - w * f, h / 2 + t); line(c, w / 2 + w * f, h / 2 - t, w / 2 + w * f, h / 2 + t); });
      c.stroke();
      K.label(w / 2, h * 0.06, 'MIRROR AXIS');
    }},
    { id: 'phi', name: 'Golden ratio', tip: 'Like thirds, but closer to the centre for a more natural balance.', draw(c, w, h, L) {
      const a = 1 / (PHI * PHI), b = 1 / PHI;
      c.beginPath(); [a, b].forEach(f => { line(c, w * f, 0, w * f, h); line(c, 0, h * f, w, h * f); }); c.stroke();
      c.beginPath(); [a, b].forEach(i => [a, b].forEach(j => dot(c, w * i, h * j, L * 3))); c.fill();
    }},
    { id: 'spiral', name: 'Golden spiral', tip: 'Put the subject at the eye of the spiral. Use Flip to change direction.', draw(c, w, h, L) {
      c.save();
      if (h > w) { c.transform(0, 1, 1, 0, 0, 0); [w, h] = [h, w]; }
      const k = 1 / PHI, guides = new Path2D(), sp = new Path2D(), P = Math.PI;
      let x = 0, y = 0, rw = w, rh = h;
      for (let i = 0; i < 11; i++) {
        const d = i % 4;
        if (d === 0) { const s = rw * k; guides.moveTo(x + s, y); guides.lineTo(x + s, y + rh);
          sp.ellipse(x + s, y + rh, s, rh, 0, P, 1.5 * P); x += s; rw -= s; }
        else if (d === 1) { const s = rh * k; guides.moveTo(x, y + s); guides.lineTo(x + rw, y + s);
          sp.ellipse(x, y + s, rw, s, 0, 1.5 * P, 2 * P); y += s; rh -= s; }
        else if (d === 2) { const s = rw * k; guides.moveTo(x + rw - s, y); guides.lineTo(x + rw - s, y + rh);
          sp.ellipse(x + rw - s, y, s, rh, 0, 0, 0.5 * P); rw -= s; }
        else { const s = rh * k; guides.moveTo(x, y + rh - s); guides.lineTo(x + rw, y + rh - s);
          sp.ellipse(x + rw, y + rh - s, rw, s, 0, 0.5 * P, P); rh -= s; }
      }
      faint(c, 0.45, () => c.stroke(guides));
      c.lineWidth = L * 1.6; c.stroke(sp);
      c.beginPath(); dot(c, x + rw / 2, y + rh / 2, L * 3.5); c.fill();
      c.restore();
    }},
    { id: 'leading', name: 'Leading lines', focus: true, tip: 'Use roads, rails or walls to lead to the subject. Tap to move the point.', draw(c, w, h, L, K) {
      const [fx, fy] = K.focus();
      c.beginPath();
      [[0, h], [w, h], [w * 0.28, h], [w * 0.72, h], [0, h * 0.62], [w, h * 0.62]].forEach(([x, y]) => line(c, x, y, fx, fy));
      c.stroke();
      c.beginPath(); c.arc(fx, fy, Math.min(w, h) * 0.05, 0, Math.PI * 2); c.stroke();
      c.beginPath(); dot(c, fx, fy, L * 3); c.fill();
    }},
    { id: 'diagonal', name: 'Diagonal', tip: 'Place key lines and the subject along the 45° diagonals.', draw(c, w, h) {
      c.beginPath(); ray(c, 0, 0, 1, 1, w, h); ray(c, w, 0, -1, 1, w, h); ray(c, 0, h, 1, -1, w, h); ray(c, w, h, -1, -1, w, h); c.stroke();
      faint(c, 0.4, () => { c.beginPath(); line(c, 0, 0, w, h); line(c, w, 0, 0, h); c.stroke(); });
    }},
    { id: 'fif', name: 'Frame within frame', tip: 'Use a door, window or arch as a frame inside the frame.', draw(c, w, h, L, K) {
      const x = w * 0.18, y = h * 0.16, iw = w * 0.64, ih = h * 0.6;
      c.save(); c.globalAlpha = 1; c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.rect(0, 0, w, h); c.rect(x, y, iw, ih); c.fill('evenodd'); c.restore();
      c.save(); c.lineWidth = L * 1.8; c.beginPath(); c.rect(x, y, iw, ih); c.stroke(); c.restore();
      c.beginPath(); brackets(c, x + iw * 0.3, y + ih * 0.3, iw * 0.4, ih * 0.4, Math.min(iw, ih) * 0.08); c.stroke();
      K.label(w / 2, y / 2, 'DOOR / WINDOW / ARCH'); K.label(w / 2, y + ih * 0.5, 'SUBJECT');
    }},
    { id: 'negative', name: 'Negative space', tip: 'Keep the subject small and leave the rest empty. Flip to switch sides.', draw(c, w, h, L, K) {
      const m = Math.min(w, h), sx = w * 0.22, sy = h * 0.74, r = m * 0.08;
      c.save(); c.lineWidth = L * 1.8; c.beginPath(); c.arc(sx, sy, r, 0, Math.PI * 2); c.stroke(); c.restore();
      dashed(c, L, () => { c.beginPath(); c.rect(w * 0.38, h * 0.08, w * 0.56, h * 0.56); c.stroke(); });

      how: ['Tap the frame to set the vanishing point.', 'Place it on a third, or at the centre for a symmetrical look.', 'Put the subject at or close to the vanishing point.', 'Keep the camera level so vertical lines stay straight.'],
      avoid: ['A vanishing point with nothing interesting at it', 'Pointing the camera up or down, which bends the vertical lines']
    },
    tilted: {
      what: 'The camera is deliberately rotated so the horizon is not level (often called a Dutch angle). It creates tension, unease, energy or fun.',
      when: ['Action and fight scenes', 'Music videos and high-energy reels', 'Comedy or chaotic moments', 'Point-of-view shots'],
      examples: ['A fast hook shot tilted to add energy', 'A dance reel that alternates the tilt on each beat', 'A suspense moment in a story reel', 'A crowd shot at a party'],
      how: ['Tilt the camera about 10–20° so the scene matches the guide.', 'Use Flip ↔ to tilt the other way.', 'Make it clearly deliberate — a slight tilt just looks like a mistake.', 'Use it for a few shots, not the whole video.'],
      avoid: ['A 2–3° tilt that looks accidental', 'Using it for calm or premium content']
    },
    gtriangles: {
      what: 'One diagonal plus two lines drawn at right angles to it from the other corners divide the frame into four triangles. Subjects are placed where the lines meet.',
      when: ['Dynamic landscapes', 'Portraits with a diagonal pose', 'Products placed at an angle', 'Two subjects in one frame'],
      examples: ['A mountain ridge along the diagonal with a hiker at one meeting point', 'A bottle lying diagonally with the label at a meeting point', 'Two people facing each other at the two meeting points', 'A road running diagonally through the frame'],
      how: ['Line the main diagonal up with a strong line in the scene.', 'Place subjects on the two dots.', 'Use Flip to change the direction of the diagonal.'],
      avoid: ['Using only the diagonal and ignoring the meeting points']
    },
    dynamic: {
      what: 'A system taken from classical painting: the two main diagonals plus "reciprocal" lines drawn at right angles to them. Placing edges and subjects on these lines creates strong, energetic compositions.',
      when: ['Street photography', 'Cinematic stills', 'Sport', 'Complex scenes with many elements'],
      examples: ['A cyclist’s body aligned with a diagonal', 'Shadows falling along a reciprocal line', 'A street scene where building edges follow the lines', 'A dancer’s arms following the diagonals'],
      how: ['Line up strong edges in the scene with the diagonals.', 'Place key points where the lines cross.', 'Use it for complex scenes where thirds feels too simple.'],
      avoid: ['Trying to align everything — pick two or three key elements']
    },
    reels: {
      what: 'Instagram shows the username, caption, buttons and audio on top of every Reel. This guide shows the approximate area that stays clear, based on Meta’s 9:16 guidance: roughly 14% at the top, 35% at the bottom and 6% on each side.',
      when: ['Every vertical video with faces or on-screen text', 'Hooks with text on screen', 'Product shots with a price or label', 'Ads'],
      examples: ['Keeping the creator’s face inside the box throughout a talking-head reel', 'Placing a headline in the upper part of the box', 'Keeping a product logo out of the caption area at the bottom', 'Placing subtitles just above the shaded bottom area'],
      how: ['Choose the 9:16 frame shape.', 'Keep faces, text and products inside the box.', 'Put nothing important in the shaded bottom area.', 'Check that the buttons on the right will not cover key content.'],
      avoid: ['Subtitles in the bottom 35% of the frame', 'Logos in the top corners']
    },
    none: {
      what: 'No guides — just the live camera, so you can judge the shot exactly as it will be recorded.',
      when: ['A final check of the clean frame before you switch to Blackmagic and record'],
      examples: [], how: [], avoid: []
    }
  };

  // ---------- layout ----------
  function aspectRatio() { const a = ASPECTS.find(a => a.id === state.aspect); return a ? a.r : 9 / 16; }
  function layout() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    let r = aspectRatio(), fw, fh;
    if (!r) { fw = sw; fh = sh; } else { fw = Math.min(sw, sh * r); fh = fw / r; }
    W = Math.round(fw); H = Math.round(fh);
    frame.style.width = W + 'px'; frame.style.height = H + 'px';
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    [bg, ov, ref].forEach(cv => {
      if (cv === ref && hasRef) return; // keep the frozen frame's pixels
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    });
    drawSample(); render();
  }

  // ---------- sample scene (shown until camera starts) ----------
  function drawSample() {
    const c = bg.getContext('2d'), w = bg.width, h = bg.height;
    const sky = c.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#20314d'); sky.addColorStop(0.55, '#d98a5a'); sky.addColorStop(0.62, '#f2c07a');
    sky.addColorStop(0.63, '#2b2a33'); sky.addColorStop(1, '#141319');
    c.fillStyle = sky; c.fillRect(0, 0, w, h);
    c.fillStyle = '#ffe2a8'; c.beginPath(); c.arc(w * 0.618, h * 0.56, Math.min(w, h) * 0.06, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1b1a22'; c.beginPath(); c.moveTo(0, h * 0.64);
    for (let i = 0; i <= 20; i++) c.lineTo(w * i / 20, h * (0.62 + 0.03 * Math.sin(i * 1.3) + 0.02 * Math.cos(i * 0.7)));
    c.lineTo(w, h); c.lineTo(0, h); c.fill();
    // a standing figure on the left third
    const fx = w / 3, base = h * 0.8, u = Math.min(w, h) * 0.02;
    c.fillStyle = '#0c0b10';
    c.beginPath(); c.arc(fx, base - u * 9.5, u * 1.4, 0, Math.PI * 2); c.fill();
    c.fillRect(fx - u * 1.6, base - u * 8, u * 3.2, u * 5); c.fillRect(fx - u * 1.3, base - u * 3.2, u * 1.1, u * 3.2);
    c.fillRect(fx + u * 0.2, base - u * 3.2, u * 1.1, u * 3.2);
  }

  // ---------- overlay render ----------
  let raf = 0;
  function render() { if (!raf) raf = requestAnimationFrame(paint); }
  function paint() {
    raf = 0;
    const c = ov.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, ov.width, ov.height);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = Math.max(1, Math.min(W, H) / 380);
    const tpl = TEMPLATES.find(t => t.id === state.tpl) || TEMPLATES[0];
    c.save();
    c.translate(W / 2, H / 2); c.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1); c.translate(-W / 2, -H / 2);
    c.globalAlpha = state.opacity / 100;
    c.strokeStyle = c.fillStyle = state.color; c.lineWidth = L;
    c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 2 * L;
    const labels = [];
    const K = {
      label: (x, y, text, align) => labels.push({ x, y, text, align }),
      focus: () => [state.flipH ? W - state.fx * W : state.fx * W, state.flipV ? H - state.fy * H : state.fy * H]
    };
    tpl.draw(c, W, H, L, K);
    c.restore();

    if (labels.length) {  // text drawn un-mirrored, at the flipped position
      c.save(); c.globalAlpha = Math.min(1, state.opacity / 100 + 0.15); c.fillStyle = state.color;
      c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 3 * L;
      c.font = `600 ${Math.round(Math.max(11, 12 * L))}px "Barlow Condensed", "Arial Narrow", sans-serif`;
      c.textBaseline = 'middle';
      labels.forEach(({ x, y, text, align }) => {
        const px = state.flipH ? W - x : x, py = state.flipV ? H - y : y;
        c.textAlign = !align ? 'center' : (state.flipH ? (align === 'left' ? 'right' : 'left') : align);
        c.fillText(text, px, py);
      });
      c.restore();
    }

    if (state.level && tilt !== null) {
      const ok = Math.abs(tilt) < 0.5, col = ok ? '#34d17a' : '#ff5a4f';
      c.save(); c.translate(W / 2, H / 2);
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = L;
      c.beginPath(); line(c, -W * 0.22, 0, -W * 0.12, 0); line(c, W * 0.12, 0, W * 0.22, 0); c.stroke();
      c.rotate(-tilt * Math.PI / 180);
      c.strokeStyle = col; c.lineWidth = L * 2.2;
      c.beginPath(); line(c, -W * 0.34, 0, W * 0.34, 0); c.stroke();
      c.restore();
    }
  }

  // ---------- UI build ----------
  function pressed(el, v) { el.setAttribute('aria-pressed', String(!!v)); }
  const aspectsEl = $('aspects'), chipsEl = $('chips'), swEl = $('swatches');
  ASPECTS.forEach(a => {
    const b = document.createElement('button'); b.textContent = a.id; b.dataset.id = a.id;
    b.onclick = () => { state.aspect = a.id; save(); syncUI(); layout(); if (hasRef) clearRef(); };
    aspectsEl.appendChild(b);
  });
  TEMPLATES.forEach(t => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = t.name; b.dataset.id = t.id;
    b.onclick = () => setTpl(t.id);
    chipsEl.appendChild(b);
  });
  COLORS.forEach(col => {
    const b = document.createElement('button'); b.className = 'sw'; b.style.background = col; b.dataset.c = col;
    b.setAttribute('aria-label', 'Line colour ' + col);
    b.onclick = () => { state.color = col; save(); syncUI(); render(); };
    swEl.appendChild(b);
  });
  function syncUI() {
    aspectsEl.querySelectorAll('button').forEach(b => pressed(b, b.dataset.id === state.aspect));
    chipsEl.querySelectorAll('button').forEach(b => pressed(b, b.dataset.id === state.tpl));
    swEl.querySelectorAll('button').forEach(b => pressed(b, b.dataset.c === state.color));
    pressed($('flipH'), state.flipH); pressed($('flipV'), state.flipV); pressed($('levelBtn'), state.level);
    $('opacity').value = state.opacity;
    $('levelOut').hidden = !state.level;
  }
  let toastT;
  // short status messages only (e.g. "Reference locked"); instructions live in the card below
  function toast(msg) { const t = $('toast'); t.textContent = msg;
    t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 1200); }

  // ---------- instruction card + learn-more sheet ----------
  function currentTpl() { return TEMPLATES.find(t => t.id === state.tpl) || TEMPLATES[0]; }
  function syncInfo() {
    const t = currentTpl();
    $('infoName').textContent = t.name; $('infoTip').textContent = t.tip; $('pillName').textContent = t.name;
    $('info').hidden = state.infoMin; $('infoPill').hidden = !state.infoMin;
    $('learnBtn').hidden = t.id === 'none';
  }
  function setInfoMin(v) { state.infoMin = v; save(); syncInfo(); }
  $('infoMin').onclick = () => setInfoMin(true);
  $('infoPill').onclick = () => setInfoMin(false);

  function list(tag, items, cls) {
    const el = document.createElement(tag); if (cls) el.className = cls;
    items.forEach(x => { const li = document.createElement('li'); li.textContent = x; el.appendChild(li); });
    return el;
  }
  function openSheet() {
    const t = currentTpl(), d = INFO[t.id]; if (!d) return;
    $('sheetTitle').textContent = t.name;
    const body = $('sheetBody'); body.textContent = '';
    const add = (title, node) => { const h = document.createElement('h3'); h.textContent = title; body.append(h, node); };
    const p = document.createElement('p'); p.textContent = d.what; add('What it is', p);
    if (d.when.length) add('When to use it', list('ul', d.when));
    if (d.examples.length) add('Examples', list('ul', d.examples));
    if (d.how.length) add('How to set it up', list('ol', d.how));
    if (d.avoid.length) add('Avoid', list('ul', d.avoid, 'avoid'));
    const done = document.createElement('button'); done.className = 'done'; done.textContent = 'Got it — minimise';
    done.onclick = closeSheet; body.appendChild(done);
    body.scrollTop = 0; $('sheetBack').hidden = false;
  }
  function closeSheet() { $('sheetBack').hidden = true; setInfoMin(true); }
  $('learnBtn').onclick = openSheet;
  $('sheetMin').onclick = closeSheet;
  $('sheetBack').addEventListener('click', e => { if (e.target === $('sheetBack')) closeSheet(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheetBack').hidden) closeSheet(); });
  function setTpl(id) {
    state.tpl = id; save(); syncUI(); render();
    syncInfo();
    const chip = chipsEl.querySelector(`[data-id="${id}"]`); chip && chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }
  function stepTpl(dir) {
    const i = TEMPLATES.findIndex(t => t.id === state.tpl);
    setTpl(TEMPLATES[(i + dir + TEMPLATES.length) % TEMPLATES.length].id);
  }

  $('opacity').oninput = (e) => { state.opacity = +e.target.value; save(); render(); };
  $('flipH').onclick = () => { state.flipH = !state.flipH; save(); syncUI(); render(); };
  $('flipV').onclick = () => { state.flipV = !state.flipV; save(); syncUI(); render(); };

  // swipe on the frame to change template
  let sx = null, sy = null;
  stage.addEventListener('touchstart', e => { if (!$('sheetBack').hidden) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) { stepTpl(dx < 0 ? 1 : -1); swipedAt = Date.now(); }
    sx = null;
  }, { passive: true });
  // tap on the frame moves the point for leading lines / radial / vanishing point
  let swipedAt = 0;
  frame.addEventListener('click', e => {
    if (Date.now() - swipedAt < 400) return;
    const tpl = TEMPLATES.find(t => t.id === state.tpl); if (!tpl || !tpl.focus) return;
    const r = frame.getBoundingClientRect();
    state.fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    state.fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    save(); render();
  });
  window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') stepTpl(1); if (e.key === 'ArrowLeft') stepTpl(-1); });

  // ---------- camera ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

  async function startCamera() {
    const msg = $('gateMsg');
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg.className = 'err';
      msg.textContent = 'The camera only works over HTTPS. Open this page from an HTTPS address such as tools.u2berclub.com in Safari.';
      return;
    }
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { facingMode: { ideal: state.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      video.srcObject = stream; video.hidden = false;
      video.classList.toggle('mirror', state.facing === 'user');
      await video.play().catch(() => {});
      $('gate').hidden = true; keepAwake();
    } catch (err) {
      msg.className = 'err';
      msg.textContent = err && err.name === 'NotAllowedError'
        ? 'Camera access is blocked. Go to Settings › Safari › Camera, choose "Allow", then reload this page.'
        : 'The camera could not start (' + (err && err.name || 'error') + '). Reload the page and try again.';
    }
  }
  $('startBtn').onclick = startCamera;
  $('flipCam').onclick = () => { state.facing = state.facing === 'user' ? 'environment' : 'user'; save(); if (stream) startCamera(); };

  // ---------- reference frame (freeze & ghost) ----------
  function clearRef() { hasRef = false; ref.hidden = true; pressed($('refBtn'), false); $('refLabel').textContent = 'Ref'; }
  $('refBtn').onclick = () => {
    if (hasRef) { clearRef(); toast('Reference cleared'); return; }
    ref.width = Math.round(W * dpr); ref.height = Math.round(H * dpr);
    const c = ref.getContext('2d');
    if (stream && video.videoWidth) {
      const vr = video.videoWidth / video.videoHeight, fr = W / H;
      let sw = video.videoWidth, sh = video.videoHeight, sx0 = 0, sy0 = 0;
      if (vr > fr) { sw = sh * fr; sx0 = (video.videoWidth - sw) / 2; } else { sh = sw / fr; sy0 = (video.videoHeight - sh) / 2; }
      c.drawImage(video, sx0, sy0, sw, sh, 0, 0, ref.width, ref.height);
      ref.classList.toggle('mirror', state.facing === 'user');
    } else {
      c.drawImage(bg, 0, 0);
    }
    hasRef = true; ref.hidden = false; pressed($('refBtn'), true); $('refLabel').textContent = 'Clear';
    toast('Reference locked');
  };

  // ---------- horizon level ----------
  function onMotion(e) {
    const g = e.accelerationIncludingGravity; if (!g || g.x === null) return;
    const mag = Math.hypot(g.x, g.y);
    if (mag < 3) { tilt = null; $('levelOut').textContent = 'FLAT'; render(); return; } // phone lying flat
    let a = Math.atan2(g.x, -g.y) * 180 / Math.PI;
    a = a - 90 * Math.round(a / 90);           // deviation from nearest upright / landscape
    tilt = tilt === null ? a : tilt * 0.7 + a * 0.3; // light smoothing
    const out = $('levelOut'); out.textContent = (tilt >= 0 ? '+' : '') + tilt.toFixed(1) + '°';
    out.style.color = Math.abs(tilt) < 0.5 ? 'var(--ok)' : 'var(--ink)';
    render();
  }
  let motionOn = false;
  async function enableLevel() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') throw new Error('denied');
      }
      if (!motionOn) { window.addEventListener('devicemotion', onMotion); motionOn = true; }
      return true;
    } catch (e) { toast('Motion access is needed for the level'); return false; }
  }
  $('levelBtn').onclick = async () => {
    if (!state.level) { if (!(await enableLevel())) return; state.level = true; $('levelOut').textContent = '—'; }
    else { state.level = false; tilt = null; }
    save(); syncUI(); render();
  };
  if (state.level) { state.level = false; } // motion permission needs a tap each visit on iOS

  // ---------- boot ----------
  new ResizeObserver(layout).observe(stage);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  syncUI(); syncInfo(); layout();
})();
</script>
</body>
</html>
